name: Sync home content

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch snapshot
        env:
          API_URL: ${{ secrets.API_URL }}
        run: node scripts/sync-home-content.mjs
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add src/data/home-snapshot.json
          git diff --cached --quiet || git commit -m "chore: sync home content snapshot"
          git push
